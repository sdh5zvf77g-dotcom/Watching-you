<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>I Am Watching You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Camera */
    #camera-container {
      position: relative;
      flex: 1;
      background: #111;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      display: none;
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      padding-top: max(16px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 10;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .key-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Bottom controls */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      padding-bottom: max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      z-index: 10;
    }

    .capture-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: white;
      border: 4px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .capture-btn:active {
      transform: scale(0.92);
    }

    .capture-btn:disabled {
      opacity: 0.6;
    }

    .eye-icon {
      font-size: 32px;
      color: #e11;
    }

    /* Description card */
    .description-card {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 16px;
      display: none;
      animation: slideUp 0.3s ease;
    }

    .description-card.visible {
      display: block;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 15px;
    }

    .card-header .eye {
      color: #e11;
    }

    .description-text {
      font-size: 15px;
      line-height: 1.45;
      margin-bottom: 14px;
      color: #eee;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .card-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-speak {
      background: #2563eb;
      color: white;
    }

    .btn-clear {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    /* Loading */
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #ccc;
      border-top-color: #e11;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* API Key modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.visible {
      display: flex;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
    }

    .modal-content h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .modal-content p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 16px;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2c2c2e;
      color: white;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-cancel {
      background: #333;
      color: white;
    }

    .error-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #b91c1c;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 200;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    .error-toast.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="top-bar">
      <div class="title">I Am Watching You</div>
      <button class="key-btn" id="keyBtn" title="API Key">🔑</button>
    </div>

    <div class="bottom-bar">
      <div class="description-card" id="descCard">
        <div class="card-header">
          <span class="eye">👁</span>
          <span>I Am Watching You</span>
          <span id="speakingIcon" style="margin-left:auto; color:#22c55e; display:none;">🔊</span>
        </div>
        <div class="description-text" id="descText"></div>
        <div class="card-actions">
          <button class="btn-speak" id="speakBtn">Speak Again</button>
          <button class="btn-clear" id="clearBtn">Clear</button>
        </div>
      </div>

      <button class="capture-btn" id="captureBtn">
        <span class="eye-icon" id="eyeIcon">👁</span>
        <div class="spinner" id="spinner" style="display:none;"></div>
      </button>
    </div>
  </div>

  <!-- API Key Modal -->
  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h2>OpenAI API Key</h2>
      <p>Enter your key. It stays only in this browser and is never uploaded anywhere except to OpenAI when you press the eye button.</p>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelKey">Cancel</button>
        <button class="btn-save" id="saveKey">Save</button>
      </div>
    </div>
  </div>

  <div class="error-toast" id="errorToast"></div>

  <script>
    // ---------- State ----------
    let apiKey = localStorage.getItem('openai_key') || '';
    let currentDescription = '';
    let isProcessing = false;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const spinner = document.getElementById('spinner');
    const descCard = document.getElementById('descCard');
    const descText = document.getElementById('descText');
    const speakBtn = document.getElementById('speakBtn');
    const clearBtn = document.getElementById('clearBtn');
    const speakingIcon = document.getElementById('speakingIcon');
    const keyBtn = document.getElementById('keyBtn');
    const keyModal = document.getElementById('keyModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKey = document.getElementById('saveKey');
    const cancelKey = document.getElementById('cancelKey');
    const errorToast = document.getElementById('errorToast');

    // ---------- Camera ----------
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        showError('Camera access denied. Please allow camera permission.');
      }
    }

    // ---------- Capture + Describe ----------
    captureBtn.addEventListener('click', async () => {
      if (isProcessing) return;

      if (!apiKey) {
        keyModal.classList.add('visible');
        return;
      }

      isProcessing = true;
      eyeIcon.style.display = 'none';
      spinner.style.display = 'block';
      captureBtn.disabled = true;

      try {
        // Capture frame
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const base64 = dataUrl.split(',')[1];

        // Call OpenAI
        const description = await describeImage(base64);
        currentDescription = description;

        descText.textContent = description;
        descCard.classList.add('visible');
        speak(description);

      } catch (err) {
        showError(err.message || 'Something went wrong');
      } finally {
        isProcessing = false;
        eyeIcon.style.display = 'inline';
        spinner.style.display = 'none';
        captureBtn.disabled = false;
      }
    });

    async function describeImage(base64Image) {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'gpt-4o',
          messages: [
            {
              role: 'system',
              content: 'You are a calm, observant narrator. Describe what you see in the image in 1-3 clear, natural sentences, as if you are studying or reporting the scene. Be precise, neutral, and vivid. Do not start with "I see" or "The image shows".'
            },
            {
              role: 'user',
              content: [
                { type: 'text', text: 'Describe this scene.' },
                {
                  type: 'image_url',
                  image_url: {
                    url: `data:image/jpeg;base64,${base64Image}`
                  }
                }
              ]
            }
          ],
          max_tokens: 300
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();
      return data.choices[0].message.content.trim();
    }

    // ---------- Speech ----------
    function speak(text) {
      if (!window.speechSynthesis) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1;
      utterance.lang = 'en-US';

      speakingIcon.style.display = 'inline';
      utterance.onend = () => {
        speakingIcon.style.display = 'none';
      };
      utterance.onerror = () => {
        speakingIcon.style.display = 'none';
      };

      window.speechSynthesis.speak(utterance);
    }

    speakBtn.addEventListener('click', () => {
      if (currentDescription) speak(currentDescription);
    });

    clearBtn.addEventListener('click', () => {
      window.speechSynthesis?.cancel();
      descCard.classList.remove('visible');
      currentDescription = '';
      speakingIcon.style.display = 'none';
    });

    // ---------- API Key ----------
    keyBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      keyModal.classList.add('visible');
    });

    saveKey.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('openai_key', apiKey);
      keyModal.classList.remove('visible');
    });

    cancelKey.addEventListener('click', () => {
      keyModal.classList.remove('visible');
    });

    // ---------- Error ----------
    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('visible');
      setTimeout(() => errorToast.classList.remove('visible'), 4000);
    }

    // ---------- Start ----------
    startCamera();
  </script>
</body>
</html>
